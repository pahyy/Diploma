[pytest]
testpaths = tests
markers =
    representative: two real-LLM tests per batch for quick smoke testing (run with -m representative)
    batch01: sales with time filters (monthly trends, YoY, quarter)
    batch02: comparison queries (city, store, brand, demographic dimensions)
    batch03: brand filters via entity_filters.product_brand (includes typo fuzzy-match)
    batch04: generic product keyword / typo fuzzy-match to VALID_PRODUCT_NAMES
    batch05: product_category pass-through (all 5 categories, case-insensitive assertions)
    batch06: demographic and loyalty filters with lowercase-normalisation verification
    batch07: absolute year / explicit range / relative time queries
    batch08: top-N / ranking / sorting queries (limit, sort_by, sort_order)
    batch09: promotion routing-only (metadata.query_type == promotion_analysis)
    batch10: anomaly detection routing-only (metadata.query_type == anomaly_detection)
    batch11: explanation routing-only (metadata.query_type == explain)
    batch12: multi-turn iterative context (refine, override, extend sequences)
    batch13: complex kitchen-sink queries (brand + category + demographic + city + year)
    batch14: pure unit tests for normalize_nulls() and finalize_query() — no LLM
    sales_analyzer: SalesAnalyzer unit tests (synthetic DataFrame, no CSV/LLM)
    promotion_analyzer: PromotionAnalyzer unit tests (synthetic DataFrame, no CSV/LLM)
    anomaly_detector: AnomalyDetector unit tests (synthetic injected anomalies, no CSV/LLM)
    aggregator: ResultsAggregator routing + ResponseFormatter + prompt-shrinking unit tests
    validator: ResponseValidator (anti-hallucination number check) unit tests
    visualizer: Visualizer chart-dispatch unit tests (PNG files into tmp_path)
    query_parser_context: RetailQueryParser.remember_result_entities() unit tests (no LLM)
    period_breakdown: query_parser.apply_period_breakdown() unit tests — "po mesecih" -> trend intent (no LLM)
    explain_routing: query_parser.apply_explain_routing() unit tests — "zakaj/razloži" -> explain query_type (no LLM)
